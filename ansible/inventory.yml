# ZolumaOS Ansible Inventory
# Pas IP-adressen en gebruikersnamen aan naar jouw omgeving.

all:
  vars:
    ansible_user: zoluma            # SSH-gebruiker op de doelmachines
    ansible_python_interpreter: /usr/bin/python3

  children:
    school:
      hosts:
        zolumaos-test:
          ansible_host: 192.168.64.2
          machine_label: "UTM testmachine"
