name: Build ZolumaOS ISO

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versienummer (bijv. 1.0)'
        required: false
        default: '1.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Schijfruimte vrijmaken
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Install live-build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y live-build
          # Zoek en patch het syslinux build script
          echo "=== Live-build syslinux scripts ==="
          find /usr/lib/live/ -name "*syslinux*" 2>/dev/null || echo "(geen syslinux script gevonden)"
          grep -rl "syslinux-themes-ubuntu\|gfxboot-theme-ubuntu" /usr/lib/live/ 2>/dev/null | tee /tmp/syslinux_scripts.txt || true
          while IFS= read -r SCRIPT; do
            echo "Patching: $SCRIPT"
            sudo sed -i '/syslinux-themes-ubuntu/d' "$SCRIPT"
            sudo sed -i '/gfxboot-theme-ubuntu/d' "$SCRIPT"
          done < /tmp/syslinux_scripts.txt

      - name: Maak build directory aan
        run: mkdir -p build

      - name: Initialiseer live-build configuratie
        working-directory: build
        run: |
          # auto/config moet in de root van de build directory staan (niet in config/)
          mkdir -p auto
          cp ../auto/config auto/config
          chmod +x auto/config
          # Overige config mappen overnemen
          cp -r ../config/package-lists config/
          cp -r ../config/hooks config/
          cp -r ../config/includes.chroot config/ 2>/dev/null || true
          # Installatiescripts in chroot plaatsen
          mkdir -p config/includes.chroot/opt/zolumaos
          cp ../scripts/install-wine.sh config/includes.chroot/opt/zolumaos/
          cp ../scripts/setup-desktop.sh config/includes.chroot/opt/zolumaos/
          chmod +x config/includes.chroot/opt/zolumaos/*.sh
          # lb config uitvoeren (roept auto/config aan)
          lb config
          # Syslinux uitschakelen — pakket bestaat niet meer in noble
          echo "=== config/binary syslinux instelling ==="
          grep -i syslinux config/binary || echo "(geen syslinux regel gevonden)"
          sed -i 's/^LB_SYSLINUX=.*/LB_SYSLINUX="false"/' config/binary
          grep -q 'LB_SYSLINUX' config/binary || echo 'LB_SYSLINUX="false"' >> config/binary
          echo "=== na patch ==="
          grep -i syslinux config/binary || echo "(geen syslinux regel)"

      - name: Schijfruimte voor build
        run: df -h

      - name: Bouw ISO
        working-directory: build
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee ../build.log

      - name: Toon einde build log
        if: always()
        run: tail -100 build.log || true

      - name: Schijfruimte na build
        if: always()
        run: df -h

      - name: Hernoem ISO naar versie
        run: |
          VERSION="${{ github.event.inputs.version || '1.0' }}"
          ISO=$(ls build/zolumaos-*.iso 2>/dev/null | head -1)
          if [ -n "$ISO" ]; then
            mv "$ISO" "zolumaos-${VERSION}-amd64.iso"
          fi

      - name: Upload ISO als artifact
        uses: actions/upload-artifact@v4
        with:
          name: zolumaos-iso
          path: zolumaos-*.iso
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Maak GitHub Release aan (alleen bij tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zolumaos-*.iso
          body: |
            ## ZolumaOS ${{ github.ref_name }}

            ### Wat is ZolumaOS?
            Een gebruiksvriendelijke Linux-distributie gebaseerd op Ubuntu, met:
            - Wine/Proton standaard geïntegreerd (.exe werkt direct)
            - XFCE desktop met moderne uitstraling
            - Ingebouwde ZolumaOS Store
            - Ondersteuning voor hardware vanaf 2010

            ### Installatie
            1. Download de ISO
            2. Brandop op USB (bijv. met [Rufus](https://rufus.ie) of [Etcher](https://etcher.balena.io))
            3. Start op vanaf USB en volg de installatie-assistent
          draft: false
          prerelease: false
