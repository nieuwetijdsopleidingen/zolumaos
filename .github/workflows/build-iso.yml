name: Build ZolumaOS ISO

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versienummer (bijv. 1.0)'
        required: false
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Schijfruimte vrijmaken
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Build tools installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common \
            mtools dosfstools

      - name: Bootstrap Ubuntu basis (debootstrap)
        run: |
          sudo mkdir -p /live/chroot
          sudo debootstrap \
            --arch=amd64 \
            --components=main,restricted,universe,multiverse \
            noble /live/chroot \
            http://archive.ubuntu.com/ubuntu
          echo "Bootstrap packages: $(sudo chroot /live/chroot dpkg -l | wc -l)"

      - name: Chroot klaarmaken
        run: |
          sudo mount --bind /proc    /live/chroot/proc
          sudo mount --bind /sys     /live/chroot/sys
          sudo mount --bind /dev     /live/chroot/dev
          sudo mount --bind /dev/pts /live/chroot/dev/pts
          echo "nameserver 8.8.8.8" | sudo tee /live/chroot/etc/resolv.conf
          printf '#!/bin/sh\nexit 101\n' | sudo tee /live/chroot/usr/sbin/policy-rc.d
          sudo chmod +x /live/chroot/usr/sbin/policy-rc.d
          sudo tee /live/chroot/etc/apt/sources.list << 'EOF'
deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
deb http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
EOF
          sudo chroot /live/chroot apt-get update -qq

      - name: Kernel + live-systeem installeren
        run: |
          sudo chroot /live/chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            linux-image-generic \
            live-boot live-boot-initramfs-tools \
            live-config live-config-systemd

      - name: Desktop installeren
        run: |
          sudo chroot /live/chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xfce4-terminal xfce4-power-manager xfce4-notifyd \
            xfce4-screenshooter thunar thunar-volman thunar-archive-plugin gvfs-backends \
            lightdm lightdm-gtk-greeter plank \
            git gtk2-engines-murrine gtk2-engines-pixbuf sassc papirus-icon-theme \
            firefox network-manager network-manager-gnome \
            htop curl wget unzip file-roller evince \
            fonts-noto fonts-noto-color-emoji \
            python3-yaml parted gdisk

      - name: Wine installeren
        run: |
          sudo chroot /live/chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y wine \
            || echo "Wine niet beschikbaar in standaard repos"

      - name: Calamares installeren
        run: |
          sudo chroot /live/chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y calamares \
            || echo "Calamares niet geinstalleerd"

      - name: Systeem configureren
        run: |
          echo "zolumaos" | sudo tee /live/chroot/etc/hostname
          printf '127.0.0.1 localhost\n127.0.1.1 zolumaos\n' | sudo tee /live/chroot/etc/hosts
          sudo chroot /live/chroot ln -sf /usr/share/zoneinfo/Europe/Amsterdam /etc/localtime
          echo "nl_NL.UTF-8 UTF-8" | sudo tee -a /live/chroot/etc/locale.gen
          sudo chroot /live/chroot locale-gen || true
          echo "LANG=nl_NL.UTF-8" | sudo tee /live/chroot/etc/default/locale

          sudo chroot /live/chroot useradd -m -s /bin/bash \
            -G sudo,audio,video,netdev,plugdev user 2>/dev/null || true
          echo "user:live" | sudo chroot /live/chroot chpasswd

          sudo mkdir -p /live/chroot/etc/lightdm
          sudo tee /live/chroot/etc/lightdm/lightdm.conf << 'EOF'
[Seat:*]
autologin-user=user
autologin-user-timeout=0
user-session=xfce
EOF

      - name: Custom bestanden + hooks uitvoeren
        run: |
          sudo mkdir -p /live/chroot/opt/zolumaos
          sudo cp scripts/install-wine.sh /live/chroot/opt/zolumaos/
          sudo cp scripts/setup-desktop.sh /live/chroot/opt/zolumaos/
          sudo chmod +x /live/chroot/opt/zolumaos/*.sh

          for hook in $(ls config/hooks/live/*.hook.chroot 2>/dev/null | sort); do
            hookname=$(basename "$hook")
            echo "=== Hook: $hookname ==="
            sudo cp "$hook" /live/chroot/tmp/_hook.sh
            sudo chmod +x /live/chroot/tmp/_hook.sh
            sudo chroot /live/chroot /tmp/_hook.sh || echo "WAARSCHUWING: $hookname mislukt"
            sudo rm -f /live/chroot/tmp/_hook.sh
          done

      - name: Package check
        if: always()
        run: |
          echo "=== Packages in chroot ==="
          for pkg in xfce4 lightdm firefox wine calamares network-manager; do
            sudo chroot /live/chroot dpkg -l "$pkg" 2>/dev/null | grep -q "^ii" \
              && echo "  ✓ $pkg" || echo "  ✗ $pkg"
          done
          echo "Totaal: $(sudo chroot /live/chroot dpkg -l | wc -l) packages"

      - name: Chroot opruimen + unmount
        run: |
          sudo chroot /live/chroot apt-get clean
          sudo rm -rf /live/chroot/tmp/* /live/chroot/var/tmp/*
          sudo rm -f /live/chroot/etc/resolv.conf /live/chroot/usr/sbin/policy-rc.d
          sudo umount -l /live/chroot/dev/pts 2>/dev/null || true
          sudo umount -l /live/chroot/dev     2>/dev/null || true
          sudo umount -l /live/chroot/sys     2>/dev/null || true
          sudo umount -l /live/chroot/proc    2>/dev/null || true
          df -h

      - name: Squashfs aanmaken
        run: |
          sudo mkdir -p /live/iso/live

          # Kernel en initrd kopiëren VOOR chroot verwijderen
          VMLINUZ=$(ls /live/chroot/boot/vmlinuz-* 2>/dev/null | sort -V | tail -1)
          INITRD=$(ls /live/chroot/boot/initrd.img-* 2>/dev/null | sort -V | tail -1)
          [ -z "$VMLINUZ" ] && { echo "FOUT: Geen kernel in chroot!"; ls /live/chroot/boot/; exit 1; }
          [ -z "$INITRD"  ] && { echo "FOUT: Geen initrd in chroot!"; ls /live/chroot/boot/; exit 1; }
          echo "Kernel: $VMLINUZ"
          echo "Initrd: $INITRD"
          sudo cp "$VMLINUZ" /live/iso/live/vmlinuz
          sudo cp "$INITRD"  /live/iso/live/initrd

          echo "Aanmaken squashfs (dit duurt ~5 minuten)..."
          sudo mksquashfs /live/chroot /live/iso/live/filesystem.squashfs \
            -comp xz -e boot 2>&1 | tail -5
          ls -lh /live/iso/live/

          # Chroot verwijderen om schijfruimte vrij te maken
          sudo rm -rf /live/chroot
          df -h

      - name: ISO structuur aanmaken
        run: |
          echo "Live directory:"
          ls -lh /live/iso/live/

          sudo mkdir -p /live/iso/boot/grub
          sudo tee /live/iso/boot/grub/grub.cfg << 'EOF'
set default=0
set timeout=5

menuentry "ZolumaOS Live" {
    linux /live/vmlinuz boot=live quiet splash locales=nl_NL.UTF-8 keyboard-layouts=nl timezone=Europe/Amsterdam
    initrd /live/initrd
}
menuentry "ZolumaOS Live (veilige modus)" {
    linux /live/vmlinuz boot=live nomodeset
    initrd /live/initrd
}
EOF

      - name: GRUB boot images aanmaken
        run: |
          # EFI
          sudo grub-mkstandalone \
            --format=x86_64-efi \
            --output=/tmp/BOOTX64.EFI \
            --locales="" --fonts="" \
            "boot/grub/grub.cfg=/live/iso/boot/grub/grub.cfg"

          sudo mkdir -p /live/iso/EFI/BOOT
          truncate -s 4M /tmp/efiboot.img
          mkfs.vfat /tmp/efiboot.img
          mmd -i /tmp/efiboot.img ::/EFI ::/EFI/BOOT
          mcopy -i /tmp/efiboot.img /tmp/BOOTX64.EFI ::/EFI/BOOT/
          sudo cp /tmp/efiboot.img /live/iso/EFI/BOOT/efiboot.img

          # BIOS
          sudo grub-mkstandalone \
            --format=i386-pc \
            --output=/tmp/core.img \
            --install-modules="linux16 linux normal iso9660 biosdisk memdisk search tar ls" \
            --modules="linux16 linux normal iso9660 biosdisk search" \
            --locales="" --fonts="" \
            "boot/grub/grub.cfg=/live/iso/boot/grub/grub.cfg"
          cat /usr/lib/grub/i386-pc/cdboot.img /tmp/core.img \
            | sudo tee /live/iso/boot/grub/bios.img > /dev/null

          echo "Boot images:"
          ls -lh /tmp/BOOTX64.EFI /live/iso/EFI/BOOT/efiboot.img /live/iso/boot/grub/bios.img

      - name: ISO aanmaken
        run: |
          VERSION="${{ github.event.inputs.version || '1.0' }}"
          HYBRID_MBR=/usr/lib/grub/i386-pc/boot_hybrid.img
          [ -f "$HYBRID_MBR" ] || { echo "FOUT: boot_hybrid.img niet gevonden"; exit 1; }

          sudo xorriso -as mkisofs \
            -r -V "ZOLUMAOS" -J -joliet-long \
            --grub2-mbr "$HYBRID_MBR" \
            --protective-msdos-label \
            -partition_offset 16 \
            --mbr-force-bootable \
            -b boot/grub/bios.img \
            -c boot/grub/boot.cat \
            -no-emul-boot \
            -boot-load-size 4 \
            --grub2-boot-info \
            -eltorito-alt-boot \
            -e EFI/BOOT/efiboot.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            -o "zolumaos-${VERSION}-amd64.iso" \
            /live/iso/ 2>&1

          ls -lh zolumaos-*.iso

      - name: Schijfruimte na build
        if: always()
        run: df -h

      - name: Upload ISO als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zolumaos-iso
          path: zolumaos-*.iso
          retention-days: 30
          if-no-files-found: warn

      - name: Maak GitHub Release aan (alleen bij tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zolumaos-*.iso
          body: |
            ## ZolumaOS ${{ github.ref_name }}

            ### Wat is ZolumaOS?
            Een gebruiksvriendelijke Linux-distributie gebaseerd op Ubuntu, met:
            - Wine/Proton standaard geïntegreerd (.exe werkt direct)
            - XFCE desktop met moderne uitstraling
            - Ingebouwde ZolumaOS Store
            - Ondersteuning voor hardware vanaf 2010

            ### Installatie
            1. Download de ISO
            2. Brandop op USB (bijv. met [Rufus](https://rufus.ie) of [Etcher](https://etcher.balena.io))
            3. Start op vanaf USB en volg de installatie-assistent
          draft: false
          prerelease: false
