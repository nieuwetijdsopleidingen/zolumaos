name: Build ZolumaOS ISO

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versienummer (bijv. 1.0)'
        required: false
        default: '1.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Schijfruimte vrijmaken
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Install live-build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y live-build xorriso isolinux || true
          # Neutraliseer isohybrid aanroepen (noble heeft het niet)
          for f in $(grep -rl "isohybrid" /usr/lib/live/ /usr/share/live/ 2>/dev/null); do
            echo "Patching isohybrid in: $f"
            sudo sed -i 's/\bisohybrid\b/true/g' "$f"
          done
          # Syslinux script stubben (pakket bestaat niet in noble)
          SYSLINUX_SCRIPT=$(grep -rl "syslinux-themes-ubuntu\|gfxboot-theme-ubuntu" /usr/lib/live/ /usr/share/live/ 2>/dev/null | head -1)
          if [ -n "$SYSLINUX_SCRIPT" ]; then
            printf '#!/bin/sh\nexit 0\n' | sudo tee "$SYSLINUX_SCRIPT" > /dev/null
            sudo chmod +x "$SYSLINUX_SCRIPT"
          fi

      - name: Maak build directory aan
        run: mkdir -p build

      - name: Initialiseer live-build configuratie
        working-directory: build
        run: |
          mkdir -p auto
          cp ../auto/config auto/config
          chmod +x auto/config
          cp -r ../config/package-lists config/
          cp -r ../config/hooks config/
          cp -r ../config/includes.chroot config/ 2>/dev/null || true
          mkdir -p config/includes.chroot/opt/zolumaos
          cp ../scripts/install-wine.sh config/includes.chroot/opt/zolumaos/
          cp ../scripts/setup-desktop.sh config/includes.chroot/opt/zolumaos/
          chmod +x config/includes.chroot/opt/zolumaos/*.sh
          lb config

      - name: Schijfruimte voor build
        run: df -h

      - name: Bouw ISO
        working-directory: build
        run: |
          set -o pipefail

          # Clean vorige build-output; bewaar config/ en .build/config
          sudo rm -rf cache/ chroot/ binary binary.*
          sudo rm -f .build/bootstrap .build/chroot .build/binary
          mkdir -p .build

          # ──────────────────────────────────────────────────────────────
          # FASE 1: lb bootstrap — debootstrap minimale chroot (~350 pkgs)
          # ──────────────────────────────────────────────────────────────
          echo "=== FASE 1: lb bootstrap ==="
          sudo lb bootstrap 2>&1 | tee ../build.log
          echo "Bootstrap klaar — packages:"
          sudo chroot chroot dpkg -l 2>/dev/null | wc -l

          # ──────────────────────────────────────────────────────────────
          # FASE 2: Handmatige pakketinstallatie (omzeil kapotte lb chroot)
          # ──────────────────────────────────────────────────────────────
          echo "=== FASE 2: Handmatige chroot-setup ==="

          # Dienststart voorkomen in chroot
          printf '#!/bin/sh\nexit 101\n' | sudo tee chroot/usr/sbin/policy-rc.d > /dev/null
          sudo chmod +x chroot/usr/sbin/policy-rc.d

          # Bind mounts
          sudo mount --bind /proc    chroot/proc
          sudo mount --bind /sys     chroot/sys
          sudo mount --bind /dev     chroot/dev
          sudo mount --bind /dev/pts chroot/dev/pts

          # DNS
          echo "nameserver 8.8.8.8" | sudo tee chroot/etc/resolv.conf > /dev/null

          # includes.chroot kopiëren (normaal door lb chroot gedaan)
          if [ -d config/includes.chroot ]; then
            sudo cp -r config/includes.chroot/. chroot/
            echo "includes.chroot gekopieerd"
          fi

          # apt update in chroot
          sudo chroot chroot apt-get update -qq 2>&1 | tee -a ../build.log

          # Live-systeem basisondersteuning
          echo "--- Live-systeem pakketten ---"
          sudo chroot chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-config live-config-systemd live-boot live-boot-initramfs-tools \
            ca-certificates \
            2>&1 | tee -a ../build.log

          # Desktop en applicatiepakketten
          echo "--- Desktop pakketten ---"
          sudo chroot chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xfce4-terminal xfce4-power-manager xfce4-notifyd \
            xfce4-screenshooter thunar thunar-volman thunar-archive-plugin gvfs-backends \
            lightdm lightdm-gtk-greeter plank \
            git gtk2-engines-murrine gtk2-engines-pixbuf sassc papirus-icon-theme \
            firefox \
            network-manager network-manager-gnome \
            htop curl wget unzip file-roller evince \
            fonts-noto fonts-noto-color-emoji \
            python3-yaml \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed efibootmgr os-prober \
            parted gdisk squashfs-tools \
            2>&1 | tee -a ../build.log

          # Live gebruiker aanmaken (normaal door lb chroot gedaan)
          sudo chroot chroot useradd -m -s /bin/bash \
            -G sudo,audio,video,netdev,plugdev user 2>/dev/null || true
          echo "user:live" | sudo chroot chroot chpasswd 2>/dev/null || true

          # Wine (apart — kan falen als repo niet beschikbaar)
          echo "--- Wine ---"
          sudo chroot chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y wine \
            2>&1 | tee -a ../build.log || echo "wine niet beschikbaar — sla over"

          # Calamares (apart voor duidelijke foutmelding)
          echo "--- Calamares ---"
          sudo chroot chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y calamares \
            2>&1 | tee -a ../build.log || echo "calamares NIET geinstalleerd"

          # initramfs bijwerken na pakketinstallatie
          echo "--- initramfs update ---"
          sudo chroot chroot update-initramfs -u 2>&1 | tee -a ../build.log || true

          # Hooks uitvoeren (numerieke volgorde via bestandsnaam)
          echo "=== Hooks uitvoeren ==="
          for hook in $(ls config/hooks/live/*.hook.chroot 2>/dev/null | sort); do
            hookname=$(basename "$hook")
            echo "--- Hook: $hookname ---"
            sudo cp "$hook" chroot/tmp/_hook.sh
            sudo chmod +x chroot/tmp/_hook.sh
            sudo chroot chroot /tmp/_hook.sh 2>&1 | tee -a ../build.log || \
              echo "WAARSCHUWING: $hookname mislukt (niet fataal)"
            sudo rm -f chroot/tmp/_hook.sh
          done

          # Bind mounts opruimen
          sudo umount -l chroot/dev/pts 2>/dev/null || true
          sudo umount -l chroot/dev     2>/dev/null || true
          sudo umount -l chroot/sys     2>/dev/null || true
          sudo umount -l chroot/proc    2>/dev/null || true
          sudo rm -f chroot/usr/sbin/policy-rc.d

          echo "Chroot klaar — totaal packages:"
          sudo chroot chroot dpkg -l 2>/dev/null | wc -l

          # Markeer chroot fase als voltooid zodat lb binary dit overslaat
          sudo touch .build/chroot

          # ──────────────────────────────────────────────────────────────
          # FASE 3: lb binary — maakt ISO van de opgezette chroot
          # ──────────────────────────────────────────────────────────────
          echo "=== FASE 3: lb binary ==="
          # Syslinux uitschakelen in config/binary
          sed -i 's/^LB_SYSLINUX=.*/LB_SYSLINUX="false"/' config/binary 2>/dev/null || true
          grep -q 'LB_SYSLINUX' config/binary 2>/dev/null || echo 'LB_SYSLINUX="false"' >> config/binary
          sudo lb binary 2>&1 | tee -a ../build.log

      - name: Maak ISO hybrid bootable
        if: always()
        working-directory: build
        run: |
          ISO=$(find . -maxdepth 1 -name "*.iso" | head -1)
          if [ -z "$ISO" ]; then echo "Geen ISO gevonden"; exit 0; fi
          echo "ISO gevonden: $ISO"
          echo "=== Beschikbare .bin bestanden ==="
          find /usr/lib/ISOLINUX/ /usr/lib/syslinux/ /usr/share/syslinux/ -name "*.bin" 2>/dev/null | sort
          MBR=""
          for f in /usr/lib/ISOLINUX/isohdpfx.bin \
                   /usr/lib/syslinux/mbr/isohdpfx.bin \
                   /usr/share/syslinux/isohdpfx.bin; do
            [ -f "$f" ] && MBR="$f" && break
          done
          if [ -n "$MBR" ]; then
            echo "Hybrid MBR injecteren uit: $MBR"
            sudo dd if="$MBR" of="$ISO" bs=1 count=432 conv=notrunc status=none
            echo "Hybrid MBR toegevoegd — ISO is nu USB-bootbaar (BIOS + UEFI)"
          else
            echo "WAARSCHUWING: isohdpfx.bin niet gevonden — ISO niet hybrid bootable"
          fi

      - name: Controleer packages in ISO
        if: always()
        run: |
          echo "=== Key package check ==="
          for pkg in xfce4 xfwm4 lightdm firefox wine calamares plank network-manager live-config; do
            if grep -qE "^${pkg}(\s|$)" build/binary.packages 2>/dev/null; then
              echo "  ✓ $pkg"
            else
              echo "  ✗ $pkg NIET aanwezig"
            fi
          done
          echo ""
          echo "Totaal packages in ISO: $(wc -l < build/binary.packages 2>/dev/null || echo '?')"

      - name: Analyseer build log
        if: always()
        run: |
          echo "=== FASE 2: Pakketinstallatie ==="
          grep -E "^(--- |WAARSCHUWING:|Unpacking|Setting up|E:)" build.log | head -40 || true
          echo ""
          echo "=== FASE 3: lb binary uitkomst ==="
          grep -E "^(lb binary|P:|N:|E:|W:)" build.log | head -20 || true
          echo ""
          echo "=== Einde build log (laatste 50 regels) ==="
          tail -50 build.log

      - name: Schijfruimte na build
        if: always()
        run: df -h

      - name: Debug build output
        if: always()
        run: |
          echo "=== build/ inhoud ==="
          ls -lah build/ 2>/dev/null || echo "(build/ niet gevonden)"
          echo "=== ISO/IMG bestanden ==="
          find build/ -maxdepth 2 \( -name "*.iso" -o -name "*.img" -o -name "*.hybrid.iso" \) 2>/dev/null || echo "(niets gevonden)"

      - name: Hernoem ISO naar versie
        if: always()
        run: |
          VERSION="${{ github.event.inputs.version || '1.0' }}"
          ISO=$(find build/ -maxdepth 2 \( -name "*.iso" -o -name "*.img" \) 2>/dev/null | head -1)
          if [ -n "$ISO" ]; then
            mv "$ISO" "zolumaos-${VERSION}-amd64.iso"
            echo "ISO hernoemd: zolumaos-${VERSION}-amd64.iso (was: $ISO)"
          else
            echo "Geen ISO gevonden — volledige build/ listing:"
            find build/ -maxdepth 3 -ls 2>/dev/null | head -50 || true
          fi

      - name: Upload ISO als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zolumaos-iso
          path: zolumaos-*.iso
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Maak GitHub Release aan (alleen bij tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zolumaos-*.iso
          body: |
            ## ZolumaOS ${{ github.ref_name }}

            ### Wat is ZolumaOS?
            Een gebruiksvriendelijke Linux-distributie gebaseerd op Ubuntu, met:
            - Wine/Proton standaard geïntegreerd (.exe werkt direct)
            - XFCE desktop met moderne uitstraling
            - Ingebouwde ZolumaOS Store
            - Ondersteuning voor hardware vanaf 2010

            ### Installatie
            1. Download de ISO
            2. Brandop op USB (bijv. met [Rufus](https://rufus.ie) of [Etcher](https://etcher.balena.io))
            3. Start op vanaf USB en volg de installatie-assistent
          draft: false
          prerelease: false
